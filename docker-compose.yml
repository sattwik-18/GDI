version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: gdi_postgres
    environment:
      POSTGRES_USER: gdi_user
      POSTGRES_PASSWORD: gdi_password
      POSTGRES_DB: gdi_db
    ports:
      - "5432:5432"
    volumes:
      - gdi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdi_user -d gdi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdi_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - gdi_storage:/app/gdi_storage
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: gdi_user
      POSTGRES_PASSWORD: gdi_password
      POSTGRES_DB: gdi_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      OCR_ENGINE_PROVIDER: pytesseract
      TESSERACT_CMD: /usr/bin/tesseract
      STORAGE_ROOT: /app/gdi_storage
      TEMP_DIR: /app/gdi_storage/temp
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1"

volumes:
  gdi_pgdata:
  gdi_storage:
