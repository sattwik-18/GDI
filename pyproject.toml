[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdi-genome-engine"
version = "1.0.0"
description = "Genome Document Intelligence (GDI) Platform - Genome Extraction Engine Prototype 1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.3.0",
    "scikit-image>=0.23.1",
    "scipy>=1.13.0",
    "numpy>=1.26.4",
    "paddlepaddle>=2.6.0; platform_system != 'Windows' or python_version < '3.13'",
    "paddleocr>=2.7.3; platform_system != 'Windows' or python_version < '3.13'",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "aiofiles>=23.2.1",
    "psutil>=5.9.8",
    "PyWavelets>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "mutmut>=2.4.4",
    "pip-tools>=7.4.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
force_sort_within_sections = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101", # missing type self
    "ANN102", # missing type cls
    "S101",   # use of assert (allowed in tests)
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "S106"]
"benchmarks/*" = ["ANN", "S101"]
"src/infrastructure/database/migrations/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "fitz.*",
    "paddleocr.*",
    "paddlepaddle.*",
    "pytesseract.*",
    "PIL.*",
    "skimage.*",
    "scipy.*",
    "pywt.*",
    "psutil.*",
    "structlog.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "src/infrastructure/database/migrations/*",
    "src/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
